name: Assemble TADA demo
on:
  push:
    branches: [tada-phuong-light]
    paths:
      - 'assets/tada-part-*.js'
      - '.github/workflows/assemble-tada.yml'
permissions:
  contents: write
concurrency:
  group: tada-demo-assembly
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tada-phuong-light
      - name: Reconstruct and verify full application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          parts = []
          for i in range(1, 8):
              text = Path(f'assets/tada-part-{i}.js').read_text(encoding='utf-8')
              parts.append(json.loads(text.split('=', 1)[1].strip().removesuffix(';')))
          html = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = 'abab809341f0418bce63675fb03c38b47f7ffc671b376b56d61c80033e391eac'
          if hashlib.sha256(html).hexdigest() != expected:
              raise SystemExit('Application integrity check failed')
          Path('index.html').write_bytes(html)
          Path('.nojekyll').touch()
          print(f'Verified {len(html)} bytes; standalone application ready.')
          PY
      - name: Commit generated static site to isolated demo branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'Site already up to date.'
          else
            git commit -m 'Build verified TADA Phuong light-mode static site'
            git push origin HEAD:tada-phuong-light
          fi
