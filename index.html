function feedPosts(){let posts=ui.feed==='mine'?toMe():publicPosts();if(ui.feed==='team')posts=posts.filter(p=>person(p.from).team===person('me').team||p.to.some(id=>person(id).team===person('me').team));posts=[...posts].sort((a,b)=>ui.sort==='new'?b.createdAt-a.createdAt:a.createdAt-b.createdAt);if(!posts.length)return empty('inbox','Góc này đang đợi một lời khen.','Những đóng góp nhỏ cũng xứng đáng được nhìn thấy.','compose','Gửi lời khen đầu tiên');return posts.map((p,i)=>postCard(p)+(i===1?`<button type="button" class="mobile-banner" data-action="challenge">${icon('handshake')}<span><h3>Một lời cảm ơn, vượt khỏi team.</h3><p>Thử thách tuần này · ${weekProgress()}/30 nhịp cầu được nối</p></span>${icon('arrow')}</button>`:'')).join('')+`<div class="feed-end">${icon('leaf')}Bạn đã bắt kịp những điều tốt đẹp.<br>Đến lượt bạn lan tỏa rồi.</div>`;}
function recognitionCard(p){const v=VALUES[p.value];return `<div class="recognition-card ${p.theme}"><div class="card-kicker">${icon(v.icon)}MỘT LỜI KHEN DÀNH CHO ${p.to.length>1?'ĐỒNG ĐỘI':esc(person(p.to[0]).short.toLocaleUpperCase('vi'))}</div><h3>${esc(p.title||v.title)}</h3><div class="card-seal">${seal(p.value)}</div><p class="card-message">${esc(p.message)}</p><div class="card-footer"><span class="value-tag">${icon(v.icon)}${v.label}</span><span class="points-tag">${icon('spark')}+${p.points}${p.to.length>1?' / người':''}</span></div></div>`;}
function postCard(p){const comments=p.comments.length;return `<article class="post" data-post-id="${esc(p.id)}"><div class="post-top">${avatar(p.from)}<div class="post-author">${btn('person',esc(person(p.from).short),'',`data-id="${p.from}"`)} <span>gửi lời khen đến</span> ${p.to.map(id=>btn('person',id==='me'?'bạn':esc(person(id).short),'',`data-id="${id}"`)).join(', ')}<small>${timeAgo(p.createdAt)}<span>·</span>${icon(p.visibility==='private'?'lock':'globe')}${p.visibility==='private'?'Chỉ người gửi và người nhận':'Nest Studio'}</small></div>${btn('post-menu',icon('more'),'icon-button',`data-id="${esc(p.id)}" aria-label="Tùy chọn lời khen"`)}</div>${recognitionCard(p)}<div class="post-actions">${[['clap','👏','Vỗ tay'],['heart','🧡','Yêu thích'],['fire','🔥','Quá đỉnh']].map(([key,em,label])=>btn('react',`<span aria-hidden="true">${em}</span> ${p.reactions[key]}`,`reaction ${p.myReactions.includes(key)?'active':''}`,`data-id="${esc(p.id)}" data-reaction="${key}" aria-label="${label}: ${p.reactions[key]}" aria-pressed="${p.myReactions.includes(key)}"`)).join('')}${btn('comments',icon('comment')+(comments?`${comments} bình luận`:'Bình luận'),'comment-button',`data-id="${esc(p.id)}"`)}${btn('save',icon('bookmark','',state.saved.includes(p.id)),`save-button ${state.saved.includes(p.id)?'active':''}`,`data-id="${esc(p.id)}" aria-label="${state.saved.includes(p.id)?'Bỏ lưu':'Lưu'} lời khen" aria-pressed="${state.saved.includes(p.id)}"`)}</div></article>`;}
function empty(ic,title,description,action,label){return `<div class="empty-state">${icon(ic)}<h3>${title}</h3><p>${description}</p>${action?btn(action,label,'secondary'):''}</div>`;}
function teamPage(){return `${pageHeading('Làm việc cùng nhau. Tốt lên cùng nhau.','Một team. Nhiều điều hay.')}<div class="main-columns"><div class="main-column"><section class="page-top-feature"><div><h2>Gọi tên một người.<br>Ghi nhận một điều tốt.</h2><p>Không phải người nổi bật nhất.<br>Là người đã tạo nên khác biệt.</p></div>${icon('people')}</section><div class="directory-search">${icon('search')}<input id="team-search" type="search" placeholder="Tìm tên, vai trò hoặc phòng ban..." value="${esc(ui.search)}" aria-label="Tìm đồng đội" autocomplete="off"></div><div class="pills directory-filters" aria-label="Phòng ban">${['Tất cả','Design','Engineering','Product','People','Marketing','Operations'].map(t=>btn('team-filter',t,`pill ${ui.team===t?'active':''}`,`data-team="${t}" aria-pressed="${ui.team===t}"`)).join('')}</div><div id="team-results">${teamResults()}</div><p class="team-note">Mỗi người một thế mạnh. Cùng nhau, mình làm được nhiều hơn.</p></div>${sidebarContent()}</div>`;}
function teamResults(){const people=PEOPLE.filter(p=>p.id!=='me'&&(ui.team==='Tất cả'||p.team===ui.team)&&normalize(p.name+' '+p.role+' '+p.team).includes(normalize(ui.search)));return `<p class="directory-count"><strong>${people.length} đồng đội</strong> · Cùng tạo nên Nest Studio</p><div class="team-grid">${people.length?people.map((p,i)=>`<article class="person-card">${btn('person',`${avatar(p.id)}<h3>${p.name}</h3>`,'person-profile-button',`data-id="${p.id}"`)}<p>${p.role}</p><span class="badge ${['green','orange','purple'][PEOPLE.indexOf(p)%3]}">${icon('briefcase')}${p.team}</span>${btn('compose',icon('spark')+'Gửi lời khen','secondary',`data-id="${p.id}" aria-label="Gửi lời khen cho ${p.name}"`)}</article>`).join(''):empty('search','Chưa tìm thấy người phù hợp.','Thử tìm theo tên hoặc chọn một phòng ban khác.','clear-search','Xóa bộ lọc')}</div>`;}
function rewardsPage(){return `${pageHeading('Điều tốt bạn nhận, niềm vui bạn chọn.','Một chút vui, dành cho bạn.')}<div class="main-columns"><div class="main-column"><section class="rewards-hero"><div class="eyebrow">CHIẾC VÍ CỦA BẠN</div><div class="reward-balance"><strong>${state.wallet.toLocaleString('vi-VN')}</strong><span>điểm đổi quà</span></div><p>Những đóng góp được ghi nhận.<br>Giờ thì tự thưởng một chút nhé.</p>${seal('care')}</section><div class="between rewards-header"><h2 class="section-title">Chọn một niềm vui<span class="orange">.</span></h2>${btn('reward-history',icon('ticket')+`Quà của tôi${state.redemptions.length?' ('+state.redemptions.length+')':''}`,'text-button')}</div><div class="pills directory-filters">${['Tất cả','Ăn & uống','Nạp năng lượng','Cho đi'].map(c=>btn('reward-filter',c,`pill ${ui.rewardCategory===c?'active':''}`,`data-category="${c}" aria-pressed="${ui.rewardCategory===c}"`)).join('')}</div><div class="rewards-grid">${REWARDS.filter(r=>ui.rewardCategory==='Tất cả'||r.category===ui.rewardCategory).map(r=>btn('reward',`<div class="reward-art">${rewardArt(r.id)}<span class="reward-label">${r.tag}</span></div><div class="reward-info"><small>${r.brand}</small><h3>${r.name}</h3><div class="between"><span class="reward-price">${icon('spark')}${r.points}<small>điểm</small></span><span class="arrow-chip">${icon('arrow')}</span></div></div>`,'reward-card',`data-id="${r.id}" aria-label="${r.name} ${r.points} điểm"`)).join('')}</div><p class="shop-disclaimer">Quà tặng và số dư là dữ liệu minh họa.<br>Đổi quà trong demo không tạo giao dịch hay voucher có giá trị thực.</p></div>${sidebarContent()}</div>`;}
function profilePage(){return `${pageHeading('Những việc bạn làm đều có ý nghĩa.','Điều tốt đẹp mang tên bạn.')}<div class="main-columns"><div class="main-column"><section class="passport"><div class="passport-top"><span>THE GOOD TEAMMATE PASSPORT</span>${icon('sparkle')}</div><div class="passport-person">${avatar('me','xl')}<div><h2>Lê Minh Diệu Phương</h2><p>Product Designer · Design</p><span class="badge">${icon('leaf')}Người kết nối</span></div></div><div class="passport-stats"><div class="passport-stat"><strong>${toMe().length}</strong><small>Lời khen nhận được</small></div><div class="passport-stat"><strong>${fromMe().length}</strong><small>Lời cảm ơn đã gửi</small></div><div class="passport-stat"><strong>${state.wallet}</strong><small>Điểm để tự thưởng</small></div></div><div class="passport-bottom"><span>NEST STUDIO · GOOD THINGS TAKE A TEAM</span><span class="passport-bars">${'<i></i>'.repeat(22)}</span></div></section>
 <section class="badges-section"><div class="between"><h2 class="section-title">Dấu ấn của bạn<span class="orange">.</span></h2>${btn('badge-info','Cách ghi nhận '+icon('info'),'text-button')}</div><div class="badges-row">${[['teamwork','Người kết nối','Cùng nhau tốt hơn'],['creativity','Người mở lối','Dám nghĩ, dám làm'],['care','Trái tim ấm','Tận tâm mỗi ngày']].map(([v,n,s])=>btn('badge-info',`${seal(v)}<p>${n}</p><small>${s}</small>`,'achievement',`data-value="${v}"`)).join('')}</div></section>
 ${btn('settings',`<span class="row">${icon('settings')}Tùy chỉnh & dữ liệu demo</span>${icon('chevron')}`,'profile-settings')}
 <div class="between feed-heading"><h2 class="section-title">Những lời ở lại<span class="orange">.</span></h2></div><div class="feed-filters" role="tablist" aria-label="Lời khen cá nhân">${[['received','Đã nhận'],['sent','Đã gửi'],['saved','Đã lưu']].map(([k,l])=>btn('profile-tab',l,ui.profileTab===k?'active':'',`data-tab="${k}" role="tab" aria-selected="${ui.profileTab===k}"`)).join('')}</div><div id="profile-posts">${profilePosts()}</div></div>${sidebarContent()}</div>`;}
function profilePosts(){const posts=ui.profileTab==='received'?toMe():ui.profileTab==='sent'?fromMe():state.posts.filter(p=>state.saved.includes(p.id)&&visibleToMe(p));return posts.length?[...posts].sort((a,b)=>b.createdAt-a.createdAt).map(postCard).join(''):empty('bookmark','Lưu lại một điều làm bạn vui.','Chạm biểu tượng lưu ở lời khen để giữ lại trong góc này.');}
/* Accessible native-dialog flows. Drafts stay in memory until sent or page refresh. */
function openModal(type,data={}){lastFocused=document.activeElement;ui.modal={type,...data};renderModal();}
function closeModal(){const d=$('#sheet');ui.modal=null;if(d.open)d.close();document.body.classList.remove('modal-open');if(lastFocused?.isConnected)lastFocused.focus({preventScroll:true});}
function modalFrame(title,body,footer='',back=false){return `<div class="sheet-handle" aria-hidden="true"></div><header class="modal-header"><div class="row">${back?btn('compose-back',icon('back'),'icon-button','aria-label="Quay lại bước trước"'):''}<h2 id="modal-title">${title}</h2></div>${btn('close-modal',icon('close'),'icon-button','aria-label="Đóng"')}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}`;}
function renderModal(preserve=false){if(!ui.modal)return;const d=$('#sheet');const top=d.scrollTop;const m=ui.modal;let content='';
 if(m.type==='compose')content=composerModal();
 if(m.type==='success')content=successModal(m);
 if(m.type==='person')content=personModal(m.id);
 if(m.type==='notifications')content=notificationsModal();
 if(m.type==='comments')content=commentsModal(m.id);
 if(m.type==='post-menu')content=postMenuModal(m.id);
 if(m.type==='reward')content=rewardModal(m.id);
 if(m.type==='redeemed')content=redeemedModal(m.receipt);
 if(m.type==='reward-history')content=rewardHistoryModal();
 if(m.type==='settings')content=settingsModal();
 if(m.type==='reset-confirm')content=modalFrame('Bắt đầu lại bản demo',`<h3 class="modal-lead">Tạo lại một khởi đầu mới?</h3><div class="danger-box">Lời khen đã gửi, bình luận, phản ứng, quà đã đổi và mọi tùy chỉnh trong trình duyệt này sẽ bị xóa. Chỉ dữ liệu mẫu ban đầu được giữ lại.</div>`, `<div class="confirm-actions">${btn('settings','Giữ lại','secondary')}${btn('reset-now','Đặt lại demo','primary')}</div>`);
 if(m.type==='budget-info')content=budgetModal();
 if(m.type==='challenge')content=challengeModal();
 if(m.type==='badge-info')content=badgeModal(m.value);
 if(m.type==='workspace')content=workspaceModal();
 if(m.type==='share')content=shareModal(m.id);
 d.innerHTML=content;document.body.classList.add('modal-open');if(!d.open)d.showModal();if(preserve)d.scrollTop=top;else d.scrollTop=0;
 // Native dialog handles keyboard focus trapping and Escape. No autofocus on mobile keyboards.
 if(!preserve){const title=$('#modal-title',d);title?.setAttribute('tabindex','-1');title?.focus({preventScroll:true});}
}
function startCompose(id){if(id==='me'){toast('Lời khen này dành cho một đồng đội khác nhé.');return;}if(!ui.composer)ui.composer={step:1,selected:[],search:'',team:'Tất cả',value:'teamwork',theme:'peach',message:'',points:20,visibility:'public',error:''};if(id&&PEOPLE.some(p=>p.id===id)){ui.composer.selected=[id];ui.composer.step=2;ui.composer.search='';}openModal('compose');}
function composerPeople(){const c=ui.composer;const list=PEOPLE.filter(p=>p.id!=='me'&&(c.team==='Tất cả'||p.team===c.team)&&normalize(p.name+' '+p.role+' '+p.team).includes(normalize(c.search)));return list.length?list.map(p=>btn('choose-person',`${avatar(p.id)}<span><p>${p.name}</p><small>${p.role} · ${p.team}</small></span><span class="check-circle">${c.selected.includes(p.id)?icon('check'):''}</span>`,`person-option ${c.selected.includes(p.id)?'selected':''}`,`data-id="${p.id}" aria-pressed="${c.selected.includes(p.id)}"`)).join(''):empty('search','Chưa tìm thấy đồng đội.','Thử một tên hoặc phòng ban khác.');}
function composerModal(){const c=ui.composer;const stepper=`<div class="stepper" aria-label="Bước ${c.step} trên 3">${[1,2,3].map(i=>`<span class="${c.step>=i?'active':''}"></span>`).join('')}</div>`;let body=stepper,footer='';
 if(c.step===1){body+=`<p class="modal-eyebrow">01 / GỌI TÊN MỘT NGƯỜI</p><h3 class="modal-lead">Ai đã làm ngày của bạn<br>tốt hơn một chút?</h3><p class="modal-description">Chọn tối đa 3 đồng đội. Những việc nhỏ cũng đáng được cảm ơn.</p><div class="directory-search">${icon('search')}<input id="composer-search" type="search" placeholder="Tìm tên hoặc phòng ban..." value="${esc(c.search)}" autocomplete="off" aria-label="Tìm người nhận lời khen"></div><div class="pills">${['Tất cả','Design','Engineering','People'].map(t=>btn('composer-team',t,`pill ${c.team===t?'active':''}`,`data-team="${t}" aria-pressed="${c.team===t}"`)).join('')}</div><div class="composer-person-list" id="composer-people">${composerPeople()}</div><p class="selection-cap">Điểm được tặng cho từng người bạn chọn.</p>`;footer=`<div class="between"><span id="selected-count">Đã chọn ${c.selected.length}/3 đồng đội</span><strong>Còn ${state.giftRemaining} điểm tặng</strong></div>${btn('compose-next','Viết lời cảm ơn '+icon('arrow'),'primary',`id="composer-next" ${!c.selected.length?'disabled':''}`)}`;}
 if(c.step===2){body+=`<p class="modal-eyebrow">02 / GHI NHẬN MỘT ĐIỀU TỐT</p><h3 class="modal-lead">Lời thật lòng,<br>luôn là lời hay nhất.</h3><p class="modal-description">Họ đã làm gì? Điều đó giúp bạn hoặc team ra sao?</p><div class="selected-people">${c.selected.map(id=>`<span class="selected-chip">${avatar(id)}${esc(person(id).short)}</span>`).join('')}${btn('edit-recipients','Đổi người nhận','text-button')}</div><label class="form-label">Điều bạn muốn ghi nhận</label><div class="value-grid">${Object.entries(VALUES).map(([k,v])=>btn('select-value',icon(v.icon)+v.label,`value-option ${c.value===k?'active':''}`,`data-value="${k}" aria-pressed="${c.value===k}"`)).join('')}</div><div class="message-label-row"><label for="composer-message" class="form-label">Lời cảm ơn của bạn</label>${btn('suggest-message',icon('sparkle')+'Gợi ý mở đầu','template-button')}</div><textarea id="composer-message" class="composer-message" maxlength="500" placeholder="Cảm ơn bạn vì đã... Nhờ có bạn, team mình...">${esc(c.message)}</textarea><div class="field-helper"><span>Ít nhất 12 ký tự · Càng cụ thể, càng ý nghĩa</span><span id="message-count">${c.message.trim().length}/500</span></div><div id="composer-error" class="form-error" role="alert">${esc(c.error)}</div><label class="form-label">Chọn màu cho lời cảm ơn</label><div class="theme-options">${[['peach','#ffe9dc','Đào ấm'],['mint','#e6efdb','Xanh lá'],['lavender','#eee7fb','Tím nhạt'],['yellow','#f8edbe','Vàng mật ong']].map(([k,clr,label])=>btn('select-theme',c.theme===k?icon('check'):'',`theme-option ${c.theme===k?'active':''}`,`data-theme="${k}" style="--swatch:${clr}" aria-label="${label}" aria-pressed="${c.theme===k}"`)).join('')}</div>`;footer=btn('compose-next','Xem trước tấm thiệp '+icon('arrow'),'primary',`id="composer-next" ${c.message.trim().length<12?'disabled':''}`);}
 if(c.step===3){const v=VALUES[c.value];const total=c.points*c.selected.length;const preview={from:'me',to:c.selected,value:c.value,theme:c.theme,message:c.message,title:v.title,points:c.points};body+=`<p class="modal-eyebrow">03 / TRAO ĐI ĐIỀU TỐT</p><h3 class="modal-lead">Một lời khen.<br>Nhiều năng lượng tốt.</h3><p class="modal-description">Xem lại tấm thiệp trước khi gửi nhé.</p><div class="preview-card">${recognitionCard(preview)}</div><div class="preview-people"><div class="avatar-stack">${c.selected.map(id=>avatar(id,'sm')).join('')}</div><span>Gửi đến ${c.selected.map(id=>esc(person(id).short)).join(', ')}</span></div><label class="form-label">Tặng thêm điểm cho mỗi người</label><div class="point-options">${[0,10,20,30].map(n=>btn('select-points',n===0?'Chỉ lời khen':icon('spark')+`+${n}`,`point-option ${c.points===n?'active':''}`,`data-points="${n}" aria-pressed="${c.points===n}" ${n*c.selected.length>state.giftRemaining?'disabled':''}`)).join('')}</div><label class="form-label">Ai có thể nhìn thấy?</label><div class="visibility-options">${[['public','globe','Cả công ty','Cùng lan tỏa điều tốt'],['private','lock','Riêng tư','Người gửi & người nhận']].map(([k,ic,n,sub])=>btn('select-visibility',`<span class="row">${icon(ic)}${n}</span><small>${sub}</small>`,`visibility-option ${c.visibility===k?'active':''}`,`data-visibility="${k}" aria-pressed="${c.visibility===k}"`)).join('')}</div>${c.visibility==='private'?'<p class="privacy-note">Thiệp riêng tư không xuất hiện trên bảng tin chung. Trong demo, quyền xem chỉ được mô phỏng trên trình duyệt, chưa có bảo mật phía máy chủ.</p>':''}<div class="form-error" role="alert">${esc(c.error)}</div>`;footer=`<div class="between"><span>${c.selected.length} người × ${c.points} điểm = <strong>${total} điểm</strong></span><span>Sau khi gửi: <strong>${state.giftRemaining-total}</strong></span></div>${btn('send-kudos',icon('send')+'Gửi lời khen','primary',`${total>state.giftRemaining?'disabled':''}`)}`;}

function navigate(page){if(!['home','team','rewards','profile'].includes(page))return;closeModal();ui.page=page;renderShell();window.scrollTo({top:0,behavior:'instant'});}
function refreshPosts(){if(ui.page==='home')$('#feed-posts').innerHTML=feedPosts();if(ui.page==='profile')$('#profile-posts').innerHTML=profilePosts();}
function getPost(id){return state.posts.find(p=>p.id===id&&visibleToMe(p));}
function toggleSaved(id){const p=getPost(id);if(!p)return;const was=state.saved.includes(id);state.saved=was?state.saved.filter(x=>x!==id):[...state.saved,id];persist();refreshPosts();if(ui.modal?.type==='post-menu')renderModal(true);toast(was?'Đã bỏ lưu lời khen.':'Đã giữ lại trong Cá nhân → Đã lưu.');}
function reaction(id,key){const p=getPost(id);if(!p||!['clap','heart','fire'].includes(key))return;const was=p.myReactions.includes(key);p.myReactions=was?p.myReactions.filter(x=>x!==key):[...p.myReactions,key];p.reactions[key]=Math.max(0,p.reactions[key]+(was?-1:1));persist();const post=$(`article[data-post-id="${CSS.escape(id)}"]`);if(post)post.outerHTML=postCard(p);}
function sendKudos(){if(sendLock)return;const c=ui.composer;if(!c||!c.selected.length||c.selected.length>3||c.selected.includes('me')||c.selected.some(id=>!PEOPLE.some(p=>p.id===id)))return;
 const message=c.message.trim();if(message.length<12||message.length>500){c.error='Hãy viết từ 12 đến 500 ký tự để lời cảm ơn đủ rõ ý.';c.step=2;renderModal();return;}
 if(!VALUES[c.value]||!['peach','mint','lavender','yellow'].includes(c.theme)||!['public','private'].includes(c.visibility)||![0,10,20,30].includes(c.points))return;
 if(state.week!==weekKey()){state.week=weekKey();state.giftRemaining=100;}
 const total=c.points*c.selected.length;if(total>state.giftRemaining){c.error='Điểm còn lại chưa đủ. Hãy chọn ít điểm hơn hoặc chỉ gửi lời khen.';renderModal();return;}
 sendLock=true;const post={id:uid(),from:'me',to:[...c.selected],value:c.value,theme:c.theme,title:VALUES[c.value].title,message,points:c.points,visibility:c.visibility,createdAt:Date.now(),reactions:{clap:0,heart:0,fire:0},myReactions:[],comments:[],local:true,week:weekKey()};state.giftRemaining-=total;state.posts.unshift(post);persist();const result={people:[...c.selected],visibility:c.visibility,total,postId:post.id};ui.composer=null;renderShell();openModal('success',result);confetti();setTimeout(()=>sendLock=false,400);}
function redeem(id){const r=REWARDS.find(r=>r.id===id);if(!r||ui.modal?.type!=='reward')return;if(state.wallet<r.points){toast('Số dư chưa đủ để đổi phần quà này.');return;}const receipt={id:uid(),rewardId:id,points:r.points,createdAt:Date.now(),code:`DEMO-${uid().replace(/[^a-z0-9]/gi,'').slice(-8).toUpperCase()}`};state.wallet-=r.points;state.redemptions.push(receipt);persist();renderShell();openModal('redeemed',{receipt});confetti();}
function downloadJSON(){const data={exportedAt:new Date().toISOString(),notice:'TADA! DEMO ONLY. Fictional data. No real points or vouchers.',...state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tada-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã tạo file xuất dữ liệu demo.');}
async function copyText(){const field=$('#share-text');if(!field)return;try{if(!navigator.clipboard)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(field.value);toast('Đã sao chép lời cảm ơn.');}catch{field.focus();field.select();toast('Trình duyệt chặn sao chép tự động. Nội dung đã được chọn để bạn sao chép.');}}
function updateComposerFooter(){const c=ui.composer;const next=$('#composer-next');if(next)next.disabled=c.step===1?!c.selected.length:c.message.trim().length<12;if($('#selected-count'))$('#selected-count').textContent=`Đã chọn ${c.selected.length}/3 đồng đội`;}
function suggestMessage(){const c=ui.composer;const names=c.selected.map(id=>person(id).short).join(' và ');const snippets={teamwork:`Cảm ơn ${names} đã cùng mình xử lý những chi tiết còn vướng. Nhờ có bạn, cả team tự tin hơn khi hoàn thành công việc.`,ownership:`Cảm ơn ${names} đã chủ động theo sát công việc và giải quyết đến cùng. Sự chỉn chu của bạn giúp team yên tâm rất nhiều.`,creativity:`Cảm ơn ${names} vì một góc nhìn mới cho bài toán của team. Ý tưởng của bạn giúp mọi thứ trở nên đơn giản và rõ ràng hơn.`,care:`Cảm ơn ${names} đã luôn để ý và hỗ trợ mọi người. Một hành động nhỏ của bạn khiến ngày làm việc của mình dễ chịu hơn rất nhiều.`};if(c.message.trim()){const ta=$('#composer-message');ta?.focus();toast('Giữ lời bạn đã viết nhé. Gợi ý: thêm một việc cụ thể và ảnh hưởng của nó.');return;}c.message=snippets[c.value];$('#composer-message').value=c.message;$('#message-count').textContent=`${c.message.length}/500`;updateComposerFooter();toast('Đây là mẫu gợi ý, hãy thêm tình huống thật của bạn.');}
/* Actions: event delegation avoids detached or duplicate listeners after view updates. */
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;switch(a){
 case 'navigate':navigate(b.dataset.page);break;
 case 'compose':startCompose(id);break;
 case 'compose-again':ui.composer=null;startCompose();break;
 case 'close-modal':closeModal();break;
 case 'find-people':navigate('team');setTimeout(()=>$('#team-search')?.focus(),40);break;
 case 'feed-filter':ui.feed=b.dataset.filter;renderShell();break;
 case 'sort':ui.sort=ui.sort==='new'?'old':'new';renderShell();break;
 case 'team-filter':ui.team=b.dataset.team;renderShell();break;
 case 'clear-search':ui.search='';ui.team='Tất cả';renderShell();break;
 case 'reward-filter':ui.rewardCategory=b.dataset.category;renderShell();break;
 case 'profile-tab':ui.profileTab=b.dataset.tab;renderShell();break;
 case 'person':openModal('person',{id});break;
 case 'view-profile':navigate('profile');break;
 case 'view-rewards':navigate('rewards');break;
 case 'react':reaction(id,b.dataset.reaction);break;
 case 'save':toggleSaved(id);break;
 case 'comments':openModal('comments',{id});break;
 case 'post-menu':openModal('post-menu',{id});break;
 case 'notifications':state.notificationsRead=true;persist();renderShell();openModal('notifications');break;
 case 'workspace':case 'budget-info':case 'challenge':case 'reward-history':case 'settings':case 'reset-confirm':openModal(a);break;
 case 'badge-info':openModal(a,{value:b.dataset.value});break;
 case 'reward':openModal('reward',{id});break;
 case 'redeem':redeem(id);break;
 case 'choose-person':{const c=ui.composer;if(c.selected.includes(id))c.selected=c.selected.filter(x=>x!==id);else if(c.selected.length<3)c.selected.push(id);else{toast('Chọn tối đa 3 đồng đội cho một tấm thiệp nhé.');break;}$('#composer-people').innerHTML=composerPeople();updateComposerFooter();break;}
 case 'composer-team':ui.composer.team=b.dataset.team;renderModal(true);break;
 case 'edit-recipients':ui.composer.step=1;renderModal();break;
 case 'compose-next':{const c=ui.composer;if(c.step===1&&!c.selected.length)return;if(c.step===2&&c.message.trim().length<12)return;c.error='';c.step=Math.min(3,c.step+1);if(c.step===3&&c.points*c.selected.length>state.giftRemaining)c.points=[30,20,10,0].find(p=>p*c.selected.length<=state.giftRemaining);renderModal();break;}
 case 'compose-back':ui.composer.step=Math.max(1,ui.composer.step-1);ui.composer.error='';renderModal();break;
 case 'select-value':ui.composer.value=b.dataset.value;ui.composer.theme=VALUES[b.dataset.value].theme;renderModal(true);break;
 case 'select-theme':ui.composer.theme=b.dataset.theme;renderModal(true);break;
 case 'select-points':ui.composer.points=Number(b.dataset.points);ui.composer.error='';renderModal(true);break;
 case 'select-visibility':ui.composer.visibility=b.dataset.visibility;renderModal(true);break;
 case 'suggest-message':suggestMessage();break;
 case 'send-kudos':sendKudos();break;
 case 'success-view':if(b.dataset.visibility==='private'){ui.profileTab='sent';navigate('profile');}else{ui.feed='all';ui.sort='new';navigate('home');setTimeout(()=>$('.feed-section')?.scrollIntoView({behavior:state.reducedMotion?'instant':'smooth',block:'start'}),50);}break;
 case 'open-post':{const p=getPost(id);if(!p){toast('Lời khen không còn trong dữ liệu demo.');break;}ui.profileTab='received';navigate('profile');setTimeout(()=>$(`article[data-post-id="${CSS.escape(id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),70);break;}
 case 'moment':startCompose(id);if(id==='chi')ui.composer.message='Chúc Quỳnh Chi một sinh nhật thật vui! Cảm ơn bạn vì luôn dành sự quan tâm và năng lượng tích cực cho mọi người trong team.';else ui.composer.message='Cảm ơn Tuấn Anh vì 3 năm đồng hành và những đóng góp bền bỉ. Có bạn trong team, những việc khó luôn nhẹ nhàng hơn rất nhiều.';ui.composer.value='care';ui.composer.theme='yellow';renderModal();break;
 case 'challenge-compose':ui.composer=null;startCompose();ui.composer.team='Engineering';renderModal();break;
 case 'toggle-motion':state.reducedMotion=!state.reducedMotion;persist();renderShell();renderModal(true);break;
 case 'export-data':downloadJSON();break;
 case 'reset-now':state=initialState();ui.composer=null;ui.search='';ui.team='Tất cả';ui.feed='all';ui.profileTab='received';persist();navigate('home');toast('Đã khôi phục bộ dữ liệu demo ban đầu.');break;
 case 'share':if(getPost(id))openModal('share',{id});break;
 case 'copy-text':copyText();break;
 case 'report':if(getPost(id)&&!state.reports.includes(id)){state.reports.push(id);persist();closeModal();toast('Đã lưu báo cáo demo. Chưa gửi đến quản trị viên.');}break;
 case 'install-info':showInstallInfo();break;
 }});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='team-search'){ui.search=el.value;$('#team-results').innerHTML=teamResults();}if(el.id==='composer-search'){ui.composer.search=el.value;$('#composer-people').innerHTML=composerPeople();}if(el.id==='composer-message'){ui.composer.message=el.value;ui.composer.error='';$('#message-count').textContent=`${el.value.trim().length}/500`;$('#composer-error').textContent='';updateComposerFooter();}});
document.addEventListener('submit',event=>{if(event.target.id!=='comment-form')return;event.preventDefault();const p=getPost(event.target.dataset.id);const field=$('#comment-input');const text=field.value.trim();if(!p||!text)return;if(text.length>300){toast('Bình luận tối đa 300 ký tự nhé.');return;}p.comments.push({id:uid(),from:'me',text,createdAt:Date.now()});persist();refreshPosts();renderModal(true);toast('Đã thêm một lời động viên.');});
const dialog=$('#sheet');dialog.addEventListener('cancel',()=>{ui.modal=null;document.body.classList.remove('modal-open');});dialog.addEventListener('close',()=>{ui.modal=null;document.body.classList.remove('modal-open');});dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();});
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
async function showInstallInfo(){if(installPrompt){await installPrompt.prompt();installPrompt=null;return;}openModal('install-help');const standalone=matchMedia('(display-mode: standalone)').matches;$('#sheet').innerHTML=modalFrame('Mang TADA! theo bên mình',`<h3 class="modal-lead">Một chạm là đến<br>với điều tốt đẹp.</h3><p class="modal-description">${standalone?'Bạn đang mở app ở chế độ độc lập.':'Trên điện thoại, dùng menu Chia sẻ hoặc menu trình duyệt và chọn “Thêm vào màn hình chính” khi trình duyệt hỗ trợ.'}</p><div class="detail-note"><strong>Bản HTML tải về:</strong> chỉ để xem thử, không cài như PWA.<br><strong>Bản source:</strong> đã kèm manifest, icon và service worker. Cần chạy từ HTTPS hoặc localhost để dùng chế độ PWA.</div><p class="sheet-meta">Trải nghiệm cài đặt tùy thuộc thiết bị và trình duyệt.</p>`);}
window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY||!event.newValue)return;try{const next=JSON.parse(event.newValue);if(validState(next)){state=migrateProfile(next);if(state.week!==weekKey()){state.week=weekKey();state.giftRemaining=100;}renderShell();if(ui.modal)renderModal(true);toast('Đã cập nhật dữ liệu demo từ tab khác.');}}catch{ /* Ignore invalid external localStorage writes. */ }});
renderShell();persist();
if(recovered)setTimeout(()=>toast('Dữ liệu lưu không hợp lệ. Đã khôi phục bản mẫu an toàn.'),700);
// The packaged source is a PWA when served securely. Single-file demo never registers a worker.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.TADA_SINGLE_FILE){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{/* App remains usable without offline support. */}));}

</script>
